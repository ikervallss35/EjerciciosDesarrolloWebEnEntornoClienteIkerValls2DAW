<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>
</head>
<body>
Valor: <input type="text" id="caja" value="0">
<br><br>
<button onclick="sumar()">Sumar</button>
<button onclick="inicializar()">Inicializar</button>

<script>
    function sumar() {
        var valor = parseInt(document.getElementById("caja").value);
        valor += 10;
        document.getElementById("caja").value = valor;
    }
    function inicializar() {
        document.getElementById("caja").value = 0;
    }
</script>
</body>
</html>
