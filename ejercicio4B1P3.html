<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <script>
        var imagenes;
        var enlaces;

        document.addEventListener('DOMContentLoaded', function() {
            imagenes = document.getElementsByTagName('img');
            enlaces = document.getElementsByTagName('a');
        });
        function contarImagenes() {
            alert("Número total de imágenes: " + imagenes.length);
        }
        function contarEnlaces() {
            alert("Número total de enlaces: " + enlaces.length);
        }
    </script>
</head>
<body>
    <img src="imagen1.jpg" alt="Imagen 1"><br>
    <img src="imagen2.jpg" alt="Imagen 2"><br>
    <img src="imagen3.jpg" alt="Imagen 3">
    <br><br>
    <a href="https://www.google.com">Google</a><br>
    <a href="https://www.wikipedia.org">Wikipedia</a>
    <br><br>
    <button onclick="contarImagenes()">Número de Imágenes</button>
    <button onclick="contarEnlaces()">Número de Enlaces</button>
</body>
</html>
